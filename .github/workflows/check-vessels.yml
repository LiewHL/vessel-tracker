name: Check vessel list

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography==50.0.2" "cffi==2.1.1" "pycparser==3.12"
      - name: Unlock the data
        env:
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
        run: python scripts/vault.py open
      - name: Get the vessel list (private)
        env:
          LIST_KEY: ${{ secrets.LIST_KEY }}
          LIST_REPO: ${{ vars.LIST_REPO }}
        run: python scripts/get_list.py
      - name: Check the vessel list
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python scripts/check_vessels.py --email
