name: Countries report

# On demand: Actions > Countries report > Run workflow. Leave dates empty for each ID's whole period
# so far; optionally limit to one category. Emailed to the private recipient list.
# The hourly logger also starts this for an end-of-period summary (period_end = ID).
on:
  workflow_dispatch:
    inputs:
      from:
        description: "From date YYYY-MM-DD (empty = whole period)"
        default: ""
      to:
        description: "To date YYYY-MM-DD (empty = today)"
        default: ""
      category:
        description: "Category, e.g. 2620 (empty = all)"
        default: ""
      period_end:
        description: "End-of-period summary for one ID (leave empty for the normal report)"
        default: ""
      email:
        description: "Email the report? (yes / no)"
        default: "yes"
      send_to:
        description: "Leave empty (the dashboard's Send button fills in a staff number, e.g. S3)"
        default: ""

permissions:
  contents: write

concurrency:
  # Send-button runs only add a line to the sent log, so they don't wait in (or bump) the data queue.
  group: ${{ github.event.inputs.send_to && format('request-{0}', github.run_id) || 'vessel-data' }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install --quiet "cryptography==50.0.2" "cffi==2.1.1" "pycparser==3.12" "openpyxl==3.1.5" "et-xmlfile==2.0.0"
      - name: Unlock the data
        env:
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
        run: python scripts/vault.py open

      # The vessel list lives in the private repo; this run reads it with a read-only key.
      - name: Get the vessel list (private)
        env:
          LIST_KEY: ${{ secrets.LIST_KEY }}
          LIST_REPO: ${{ vars.LIST_REPO }}
        run: python scripts/get_list.py

      # Send button (dashboard): only a staff number like S3 arrives here; the address is in the
      # STAFF_EMAILS secret. At most 5 a day per staff number. Scheduled reports are not affected.
      - name: Send button request?
        id: req
        env:
          SEND_TO: ${{ github.event.inputs.send_to }}
        run: |
          if [ -z "$SEND_TO" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! [[ "$SEND_TO" =~ ^S[0-9]{1,3}$ ]]; then echo "::error::send_to must look like S3."; exit 1; fi
          if ! python scripts/due_reports.py request "$SEND_TO"; then
            echo "::warning::$SEND_TO has already used Send 5 times today, so nothing was sent."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp reports/index.json "$RUNNER_TEMP/index.bak" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/index.bak"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Build the countries report
        id: build
        if: steps.req.outputs.go == 'true'
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          CATEGORY: ${{ github.event.inputs.category }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
        run: |
          set +e
          if [ -n "$PERIOD_END" ]; then
            python scripts/countries_report.py --period-end "$PERIOD_END" > "$RUNNER_TEMP/s.json"
          else
            python scripts/countries_report.py --from "$FROM" --to "$TO" --category "$CATEGORY" > "$RUNNER_TEMP/s.json"
          fi
          rc=$?
          set -e
          if [ $rc -eq 10 ]; then echo "::notice::Summary already made; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $rc -eq 0 ]
          echo "go=true" >> "$GITHUB_OUTPUT"
          for k in file period kind date; do
            echo "$k=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" "$RUNNER_TEMP/s.json" $k)" >> "$GITHUB_OUTPUT"
          done
      - name: Email the report (private - recipients and login are GitHub secrets)
        id: mail
        if: steps.build.outputs.go == 'true' && github.event.inputs.email != 'no'
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SEND_TO: ${{ github.event.inputs.send_to }}
          STAFF_EMAILS: ${{ secrets.STAFF_EMAILS }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SITE="https://${OWNER,,}.github.io/${REPO}"
          if [ "${{ steps.build.outputs.kind }}" = "period_end" ]; then SUBJ="End of period: ${{ steps.build.outputs.period }}"; else SUBJ="Countries visited: ${{ steps.build.outputs.period }}"; fi
          set +e
          python scripts/send_email.py reports/latest-countries-summary.md "reports/${{ steps.build.outputs.file }}" "$SUBJ" "$SITE/" ""
          rc=$?
          if [ $rc -eq 0 ]; then echo "sent=yes" >> "$GITHUB_OUTPUT"; fi
          if [ $rc -eq 3 ]; then echo "::warning::No email sent (secrets not set, or no allowed recipients). Nothing was kept."; exit 0; fi
          exit $rc

      # Keep only the sent log (dates and counts, locked) so the report is not sent twice.
      - name: Log the report as sent
        if: steps.mail.outputs.sent == 'yes'
        env:
          SEND_TO: ${{ github.event.inputs.send_to }}
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
        run: |
          if [ -n "$SEND_TO" ]; then
            python scripts/sent_log.py "${{ steps.build.outputs.kind }}" "${{ steps.build.outputs.date }}" --request "$SEND_TO" --backup "$RUNNER_TEMP/index.bak"
          else
            python scripts/sent_log.py "${{ steps.build.outputs.kind }}" "${{ steps.build.outputs.date }}"
          fi
          git config user.name "vessel-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/vault.py seal
          git add -A vault
          git diff --cached --quiet || git commit -q -m "Countries report sent"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && break
            sleep 5
          done
