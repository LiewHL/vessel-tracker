name: Change passcode

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vessel-data
  cancel-in-progress: false

jobs:
  rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography==50.0.2" "cffi==2.1.1" "pycparser==3.12"
      - name: Re-lock everything with the new passcode
        env:
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
          REPORT_PASSCODE_NEW: ${{ secrets.REPORT_PASSCODE_NEW }}
        run: |
          python scripts/vault.py rekey
          git config user.name "vessel-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vault
          git commit -q -m "Change passcode"
          git push --quiet
