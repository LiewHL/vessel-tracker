name: Update port codes

# Downloads the UN/LOCODE port code list (e.g. CNYSA = Yangshan, China) used to make
# AIS destinations readable. Run once a year or so.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and build
        run: |
          base=https://raw.githubusercontent.com/datasets/un-locode/main/data
          curl -fsSL -o "$RUNNER_TEMP/code-list.csv" "$base/code-list.csv"
          curl -fsSL -o "$RUNNER_TEMP/country-codes.csv" "$base/country-codes.csv"
          head -1 "$RUNNER_TEMP/code-list.csv"; head -1 "$RUNNER_TEMP/country-codes.csv"
          python scripts/build_locode.py "$RUNNER_TEMP/code-list.csv" "$RUNNER_TEMP/country-codes.csv"
      - name: Save
        run: |
          git config user.name "vessel-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locode.json
          git diff --cached --quiet || git commit -q -m "Update port codes (UN/LOCODE)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
