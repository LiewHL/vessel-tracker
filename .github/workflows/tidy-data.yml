name: Tidy data

# Removes ships that are no longer in vessels.csv from the logged data and applies ID changes.
# Edit vessels.csv first, then run this with any ID changes as OLD=NEW pairs, e.g. "TS07=TS02,TS08=TS03"
# (IDs not listed keep their ID). Records are kept if their ship is in any stint of that ID.
on:
  workflow_dispatch:
    inputs:
      mapping:
        description: "ID changes as OLD=NEW pairs, comma-separated (leave empty if none)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vessel-data
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always start from the latest saved data (a run queued behind another must not use an old copy)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography==50.0.2" "cffi==2.1.1" "pycparser==3.12"
      - name: Unlock, tidy and lock
        env:
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
          MAPPING: ${{ github.event.inputs.mapping }}
          VAULT_COMPACT: "1"
        run: |
          python scripts/vault.py open
          python scripts/tidy_data.py "$MAPPING"
          python scripts/vault.py seal
          git config user.name "vessel-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data; [ -d vault ] && git add -A vault
          git diff --cached --quiet || git commit -q -m "Tidy data"
          git push --quiet
