name: GFW test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography==50.0.2"
      - name: Unlock the data
        id: open
        env:
          REPORT_PASSCODE: ${{ secrets.REPORT_PASSCODE }}
        run: python scripts/vault.py open
      - name: Get the vessel list (private)
        env:
          LIST_KEY: ${{ secrets.LIST_KEY }}
          LIST_REPO: ${{ vars.LIST_REPO }}
        run: python scripts/get_list.py
      - name: Test Global Fishing Watch
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: python scripts/gfw_test.py
