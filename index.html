<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vessel Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg:#f3f6f8; --card:#ffffff; --ink:#132430; --muted:#5d6e7b; --line:#dbe3e9;
    --accent:#0b5c8c; --accent-soft:#e3f0f8; --sel:#e8f2f9;
    --fresh:#1f8a4c; --stale:#c98a00; --old:#c0392b; --none:#8b97a1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d171e; --card:#15232d; --ink:#e4edf2; --muted:#93a5b2; --line:#24363f;
      --accent:#5fb3e6; --accent-soft:#16364a; --sel:#18303d;
      --fresh:#3cc070; --stale:#e3a91a; --old:#ec6b5c; --none:#7d8b95;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
         font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); }
  button, select, input { font:inherit; color:inherit; }

  header { background:var(--card); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center;
           gap:6px 14px; padding:8px 14px; position:relative; z-index:1000; }
  h1 { font-size:16px; margin:0; white-space:nowrap; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip-k { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--bg); border-radius:999px;
            padding:3px 10px; cursor:pointer; white-space:nowrap; }
  .chip-k b { font-variant-numeric:tabular-nums; }
  .chip-k[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); }
  .spacer { flex:1 1 0; }
  .runinfo { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;
          background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .pill.bad { background:color-mix(in srgb, var(--old) 15%, transparent); color:var(--old); }
  .pill.warn { background:color-mix(in srgb, var(--stale) 18%, transparent); color:var(--ink); }
  .hbtn { border:1px solid var(--line); background:var(--card); color:var(--accent); font-weight:600; border-radius:8px;
          padding:4px 10px; cursor:pointer; }
  .hbtn:hover { background:var(--accent-soft); }
  .popover { position:absolute; right:14px; top:100%; margin-top:4px; width:min(560px, calc(100vw - 28px)); max-height:70vh; overflow:auto;
             background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; }
  .popover.open { display:block; }
  .popover h2 { font-size:14px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  .reports { list-style:none; margin:0; padding:0; }
  .reports li { display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--line); }
  .tag { display:inline-block; font-size:10px; font-weight:700; border-radius:5px; padding:1px 6px; margin-right:6px; }
  .tag.m { background:var(--accent); color:var(--card); } .tag.w { background:var(--accent-soft); color:var(--accent); }
  .foot { padding:10px 14px; color:var(--muted); font-size:12px; }
  .sendrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 14px 4px; }
  .sendrow select, .sendrow input { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:7px;
                                    background:var(--card); color:var(--ink); min-width:0; }
  .sendrow input { flex:1 1 140px; }
  #sendMsg.ok { color:var(--fresh); } #sendMsg.bad { color:var(--old); }
  .banner { background:color-mix(in srgb, var(--stale) 14%, var(--card)); border-bottom:1px solid color-mix(in srgb, var(--stale) 40%, transparent);
            padding:7px 14px; display:none; font-size:12px; }

  .ws { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:var(--left, 56%) 6px minmax(0, 1fr); }
  .left { display:grid; grid-template-rows:var(--top, 55%) 6px minmax(0, 1fr); min-height:0; min-width:0; }
  .gutter { background:var(--line); position:relative; }
  .gutter:hover, .gutter.drag { background:var(--accent); }
  .gutter.v { cursor:col-resize; } .gutter.h { cursor:row-resize; }
  .gutter::after { content:""; position:absolute; inset:-4px; }
  .pane { display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--card); }
  .ptool { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); }
  .ptool select, .ptool input[type=date] { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:4px 6px; max-width:100%; }
  .ptool .mode { font-weight:600; }
  .pbody { flex:1 1 auto; min-height:0; position:relative; }
  .pbody > .lmap, .pbody > iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; background:var(--card); color:var(--muted); padding:4px 9px; cursor:pointer; font-size:12px; font-weight:600; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:var(--card); }
  .overlay { position:absolute; z-index:500; background:color-mix(in srgb, var(--card) 92%, transparent); border:1px solid var(--line);
             border-radius:8px; padding:6px 9px; font-size:12px; }
  .tinfo { display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px; color:var(--muted); font-size:12px; margin-left:auto; min-width:0; }
  .tinfo span { display:inline-flex; align-items:center; white-space:nowrap; }
  .catchip { font:inherit; font-size:12px; display:inline-flex; align-items:center; gap:0; padding:2px 8px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; }
  .catchip:hover { border-color:var(--accent); }
  .catchip[aria-pressed="false"] { color:var(--muted); background:transparent; border-style:dashed; }
  .catchip[aria-pressed="false"] .dot { background:transparent !important; box-shadow:inset 0 0 0 1.5px var(--none); }
  .catchip[aria-pressed="false"] .cn { text-decoration:line-through; }
  .tinfo .places { color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; display:block; }
  .plist { position:absolute; z-index:600; top:6px; right:6px; width:min(440px, calc(100% - 12px)); max-height:calc(100% - 12px); overflow:auto; padding:0; }
  .plist table { width:100%; border-collapse:collapse; }
  .plist td, .plist th { text-align:left; padding:4px 8px; border-top:1px solid var(--line); white-space:nowrap; }
  .plist td:last-child { white-space:normal; }
  .plist th { color:var(--muted); font-weight:600; border-top:0; position:sticky; top:0; background:var(--card); }
  .pchip { display:inline-block; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:1px 8px; margin:2px 2px 0 0; font-weight:600; }
  .shipcard { width:min(400px, calc(100% - 12px)); padding:12px 14px; }
  .shipcard h3 { margin:0; font-size:14px; } .shipcard h4 { margin:12px 0 4px; font-size:12px; color:var(--muted); }
  .shipcard .per { max-width:none; margin:6px 0 4px; }
  table.kv { width:100%; border-collapse:collapse; margin-top:8px; }
  table.kv th { text-align:left; font-weight:600; color:var(--muted); padding:3px 10px 3px 0; white-space:nowrap; vertical-align:top; border:0; position:static; }
  table.kv td { padding:3px 0; border:0; white-space:normal; }
  .callmk, .arrowmk { background:none; border:0; }
  .shipkey { cursor:pointer; }
  .cm { display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; border-radius:4px; font:700 10px/1 system-ui,sans-serif; color:#fff; border:1.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .cm.b { background:#0b5c8c; } .cm.a { background:#c98a00; } .cm.o { background:#6250d6; }
  .tlwrap { position:absolute; inset:0; overflow:auto; padding:8px 10px; }
  .evicon { background:none; border:0; }
  .wlegend { position:absolute; left:10px; bottom:22px; z-index:500; background:var(--card); color:var(--ink); border:1px solid var(--line);
             border-radius:8px; padding:5px 8px 3px; font-size:11px; box-shadow:0 1px 4px rgba(0,0,0,.15); pointer-events:none; }
  .wlegend .wbar { width:150px; height:8px; border-radius:4px; margin:3px 0 1px;
    background:linear-gradient(90deg, rgb(198,233,247) 0%, rgb(120,198,230) 12.5%, rgb(65,160,210) 25%, rgb(90,190,120) 37.5%, rgb(240,210,70) 50%, rgb(240,150,50) 62.5%, rgb(220,70,50) 75%, rgb(150,30,90) 100%); }
  .wlegend .wlab { display:flex; justify-content:space-between; width:150px; color:var(--muted); }
  .cmpwrap { position:absolute; inset:0; overflow:auto; padding:8px 12px; font-size:13px; }
  .cmpwrap h3 { font-size:13px; margin:12px 0 4px; } .cmpwrap h3:first-child { margin-top:2px; }
  .cmpwrap table { border-collapse:collapse; width:100%; }
  .cmpwrap td, .cmpwrap th { text-align:left; padding:3px 8px; border-top:1px solid var(--line); white-space:nowrap; }
  .cmpwrap th { color:var(--muted); font-weight:600; border-top:0; }
  .cmpwrap td.num, .cmpwrap th.num { text-align:right; }
  .cmpwrap tr[data-id] { cursor:pointer; } .cmpwrap tr[data-id]:hover td { background:var(--hover, rgba(127,127,127,.08)); }
  .cmpwrap .bar { display:inline-block; width:60px; height:6px; border-radius:3px; background:var(--line); vertical-align:middle; margin-right:6px; }
  .cmpwrap .bar i { display:block; height:100%; border-radius:3px; background:var(--accent); }
  svg.tl text { font:11px system-ui,sans-serif; fill:var(--ink); } svg.tl .ax { fill:var(--muted); }
  svg.tl .grid { stroke:var(--line); } svg.tl .today { stroke:var(--old); stroke-width:1.5; } svg.tl .todayt { fill:var(--old); }
  svg.tl g.bar { cursor:pointer; } svg.tl g.bar:hover rect, svg.tl g.bar:focus rect { opacity:.8; } svg.tl g.bar:focus { outline:none; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--muted); }

  .right { display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--card); container-type:inline-size; }
  .show-s { display:none; }
  @container (max-width: 620px) { .hide-s { display:none; } .show-s { display:block; } }
  .per { font-size:11px; color:var(--muted); margin-top:3px; max-width:230px; }
  .per .pd { white-space:nowrap; }
  .per .pt { display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 8px; }
  .per .pt b { white-space:nowrap; }
  .per .bar { height:4px; border-radius:2px; background:var(--line); margin-top:3px; overflow:hidden; }
  .per .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .per.done .bar i { background:var(--fresh); }
  .per.paused .bar i { background:var(--none); }
  .ttool { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); }
  .ttool input[type=search] { flex:1 1 160px; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:4px 8px; }
  .ttool select { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:4px 6px; }
  .count { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tscroll { flex:1 1 auto; min-height:0; overflow:auto; }
  table.ships { width:100%; border-collapse:collapse; }
  table.ships th { position:sticky; top:0; z-index:2; background:var(--card); text-align:left; font-size:11px; color:var(--muted);
                   font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
  table.ships td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.ships tbody tr { cursor:pointer; }
  table.ships tbody tr:hover { background:color-mix(in srgb, var(--sel) 60%, transparent); }
  table.ships tbody tr.grp, table.ships tbody tr.sbrow { cursor:default; }
  table.ships tbody tr.sbrow td { padding-top:4px; padding-bottom:4px; color:var(--muted); }
  table.ships tbody tr.sbrow:hover { background:none; }
  table.ships tbody tr.grp:hover { background:none; }
  table.ships tbody tr.grp td { background:var(--bg); padding:0; border-bottom:1px solid var(--line); }
  .gbtn { all:unset; box-sizing:border-box; cursor:pointer; display:flex; gap:7px; align-items:center; width:100%; padding:8px; font-size:12px; }
  .gbtn:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .gbtn .caret { color:var(--muted); display:inline-block; transition:transform .15s; }
  .gbtn[aria-expanded="true"] .caret { transform:rotate(90deg); }
  .gbtn .dot { margin-right:0; }
  table.ships tbody tr.sel { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent); }
  .idc { font-weight:700; white-space:nowrap; }
  .vn { font-weight:600; }
  .sub { color:var(--muted); font-size:11px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; flex:none; }
  .fresh{background:var(--fresh)} .stale{background:var(--stale)} .old{background:var(--old)} .none{background:var(--none)}
  .nowrap { white-space:nowrap; }
  .mono { font-variant-numeric:tabular-nums; }
  .vf { text-decoration:none; font-weight:600; white-space:nowrap; }
  .hide-s { }

  .lock { position:fixed; inset:0; z-index:5000; display:none; align-items:center; justify-content:center; padding:16px; background:var(--bg); }
  .lock.open { display:flex; }
  .lock form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .lock h2 { margin:0 0 4px; font-size:18px; }
  .lock p { margin:0 0 16px; color:var(--muted); font-size:13px; line-height:1.45; }
  .lock input[type=password] { width:100%; box-sizing:border-box; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .lock input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .lock label { display:flex; gap:8px; align-items:center; margin:12px 0 16px; font-size:13px; color:var(--muted); }
  .lock button { width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .lock button:disabled { opacity:.6; cursor:wait; }
  .lock .err { color:var(--old); font-size:13px; min-height:18px; margin-top:10px; }

  @media (max-width: 900px) {
    body { height:auto; }
    .ws { display:block; }
    .left { display:block; }
    .gutter { display:none; }
    .pane { height:max(340px, 58vh); border-bottom:1px solid var(--line); }
    #pane1 { height:max(300px, 46vh); }
    .right { min-height:60vh; }
    .tscroll { overflow:visible; }
    .hide-s { display:none; }
    .show-s { display:block; }

    header { gap:6px 8px; padding:8px 10px; }
    h1 { order:0; }
    #runPill { order:1; }
    .spacer { order:2; }
    #lockBtn { order:3; }
    #reportsBtn { order:4; }
    .chips { order:5; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -10px; padding:0 10px 2px; }
    .chips::-webkit-scrollbar, .ptool::-webkit-scrollbar { display:none; }
    .chip-k { padding:3px 9px; }
    #runText { display:none; }
    #runPill { cursor:pointer; }
    #runPill::after { content:" ▾"; font-weight:400; }
    header.run-open #runText { display:block; order:6; flex:1 1 100%; color:var(--muted); font-size:12px; }
    header.run-open #runPill::after { content:" ▴"; }
    .runinfo { display:contents; }

    .ptool { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .ptool > * { flex:none; }
    .ptool .tinfo { flex-wrap:nowrap; margin-left:0; }
    .ptool select.ship { max-width:200px; }
  }
  .lk-ic { vertical-align:-2px; }
  @media (max-width: 420px) {
    h1 { font-size:15px; }
    header { gap:6px; }
    .hbtn { padding:4px 8px; }
    .lk-tx, .rp-ar { display:none; }
    .pill { padding:2px 7px; }
  }
</style>
</head>
<body>
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <form id="lockForm" autocomplete="on">
    <h2 id="lockTitle">Vessel Tracking</h2>
    <p>This dashboard is locked. Enter the passcode to view positions and reports.</p>
    <input type="text" name="username" value="vessel-tracker" autocomplete="username" hidden>
    <input type="password" id="lockPass" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" required>
    <label><input type="checkbox" id="lockRemember" checked> Remember on this device for 30 days</label>
    <button type="submit" id="lockGo">Unlock</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>
<header>
  <h1>Vessel Tracking</h1>
  <div class="chips" id="chips" role="group" aria-label="Filter by last seen"></div>
  <div class="spacer"></div>
  <div class="runinfo"><span id="runPill" class="pill" role="button" tabindex="0" aria-controls="runText" title="Logger status">Loading…</span><span id="runText"></span></div>
  <button class="hbtn" id="lockBtn" hidden title="Forget the passcode on this device and lock the dashboard" aria-label="Lock"><svg class="lk-ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="lk-tx"> Lock</span></button>
  <button class="hbtn" id="sendBtn" hidden aria-expanded="false" aria-controls="sendPop" title="Email a report to the SP address linked to your Send code">Send</button>
  <div class="popover" id="sendPop">
    <h2>Send a report by email</h2>
    <div class="sendrow"><select id="sendKind" aria-label="Report">
        <option value="weekly">Weekly (last 7 days)</option><option value="monthly">Monthly (last full month)</option>
        <option value="quarterly">Quarterly (last full quarter)</option><option value="countries">Countries (whole period)</option><option value="completion">Completion (this month + expected)</option></select>
      <input id="sendCode" type="password" autocomplete="off" placeholder="Your Send code" aria-label="Your Send code">
      <button class="hbtn" id="sendGo" type="button">Send</button></div>
    <div class="foot" id="sendMsg">The report goes to the SP email linked to your Send code (at most 5 a day). No copy is kept.</div>
  </div>
  <button class="hbtn" id="reportsBtn" aria-expanded="false" aria-controls="reportsPop">Reports<span class="rp-ar"> ▾</span></button>
  <div class="popover" id="reportsPop">
    <h2>Reports sent</h2>
    <ul class="reports" id="reports"></ul>

  </div>
</header>
<div class="banner" id="banner"></div>

<main class="ws" id="ws">
  <div class="left" id="left">
    <section class="pane" id="pane0" aria-label="Map panel 1"></section>
    <div class="gutter h" id="gutH" role="separator" aria-orientation="horizontal" aria-label="Resize map panels" tabindex="0"></div>
    <section class="pane" id="pane1" aria-label="Map panel 2"></section>
  </div>
  <div class="gutter v" id="gutV" role="separator" aria-orientation="vertical" aria-label="Resize maps and table" tabindex="0"></div>
  <section class="right" aria-label="Vessels">
    <div class="ttool">
      <input type="search" id="search" placeholder="Search ID, vessel, company" aria-label="Search vessels">
      <select id="catFilter" aria-label="Filter by category" hidden><option value="">All categories</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="tscroll">
      <table class="ships">
        <thead><tr>
          <th data-sort="id">ID</th><th data-sort="vessel_name">Vessel</th><th data-sort="_age">Last seen</th>
          <th data-sort="_place">Place</th><th class="hide-s" data-sort="_speed">Status</th><th class="hide-s" data-sort="_att">Period</th><th aria-label="Links"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  'use strict';
  const SGT = 'Asia/Singapore';
  const LABEL = { fresh:'Last 3 days', stale:'3–7 days', old:'Over 7 days', none:'No position' };
  const CAT_LIGHT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
  const CAT_DARK  = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
  const NEAR_NM = 30, DIRS = ['N','NE','E','SE','S','SW','W','NW'];
  const MODES = { fleet:'Fleet map', route:'Vessel route / history', timeline:'Timeline (periods)', countries:'Countries visited', completion:'Completion' };

    const info = document.createElement('div'); info.className = 'tinfo';
    const ASEAN = ['Brunei', 'Cambodia', 'Indonesia', 'Laos', 'Malaysia', 'Myanmar', 'Philippines', 'Thailand', 'Timor-Leste', 'Vietnam'];
    const aciOf = id => { const ks = [...(perShip[id] || new Map()).keys()]; const a = ks.filter(c => ASEAN.includes(c)); return { a, c:ks.filter(c => ['China', 'Hong Kong', 'Macao'].includes(c)), i:ks.includes('India') }; };
    const aci = { a:0, c:0, i:0, any:0 }, aciTxt = {};
    ships.forEach(x => { const h = aciOf(x.v.id); aci.a += h.a.length ? 1 : 0; aci.c += h.c.length ? 1 : 0; aci.i += h.i ? 1 : 0; aci.any += (h.a.length || h.c.length || h.i) ? 1 : 0;
      aciTxt[x.v.id] = [h.a.join(', '), h.c.join(', '), h.i ? 'India' : ''].filter(Boolean).join(' · '); });
    const nStud = pick.length, aciTip = `Called at — ASEAN (excl. Singapore): ${aci.a} · China (incl. Hong Kong, Macao): ${aci.c} · India: ${aci.i} · any: ${aci.any} of ${nStud}`;
    info.innerHTML = `<span>${n} countr${n === 1 ? 'y' : 'ies'} · ${ships.length} ship${ships.length === 1 ? '' : 's'}</span><span title="${esc(aciTip)}">ASEAN ${aci.a} · China ${aci.c} · India ${aci.i} <span style="opacity:.75">&nbsp;of ${nStud}</span></span><button class="hbtn" type="button" aria-expanded="false">List ▾</button>`;
    p.el.querySelector('.ptool').appendChild(info);
    const rowsHtml = ships.flatMap(x => [...perShip[x.v.id].entries()].map(([c, e]) => `<tr><td><b>${esc(x.v.id)}</b></td><td>${esc(c)}</td><td>${esc(e.ports.join(', '))}</td><td>${e.calls}</td><td>${esc(fmtH(e.hours))}</td></tr>`)).join('');
    const aciRows = ships.filter(x => aciTxt[x.v.id]).map(x => `<tr><td><b>${esc(x.v.id)}</b></td><td colspan="4">${esc(aciTxt[x.v.id])}</td></tr>`).join('');
    const aciHtml = `<div class="sub" style="padding:6px 8px">${esc(aciTip)}. Singapore is not counted as ASEAN; China includes Hong Kong and Macao; Taiwan is not counted.</div>`
      + (aciRows ? `<table><thead><tr><th>ID</th><th colspan="4">ASEAN · China · India</th></tr></thead><tbody>${aciRows}</tbody></table>` : '');
    const list = document.createElement('div'); list.className = 'overlay plist'; list.hidden = true;
    list.innerHTML = (rowsHtml ? `<table><thead><tr><th>ID</th><th>Country</th><th>Ports</th><th>Calls</th><th>In port</th></tr></thead><tbody>${rowsHtml}</tbody></table>`
      : '<div class="sub" style="padding:8px">No port calls in this period.</div>') + aciHtml;
    if (L.DomEvent) { L.DomEvent.disableClickPropagation(list); L.DomEvent.disableScrollPropagation(list); }
    body.appendChild(list);
    const lb = info.querySelector('button');
    lb.onclick = () => { list.hidden = !list.hidden; lb.setAttribute('aria-expanded', !list.hidden); lb.textContent = list.hidden ? 'List ▾' : 'List ▴'; };
    if (!ships.length) { const d = document.createElement('div'); d.className = 'overlay'; d.style.cssText = 'left:50%;top:12px;transform:translateX(-50%)'; d.textContent = 'No port calls recorded in this period.'; body.appendChild(d); }
  }

  function completionDate(stints) {
    let left = REQ_DAYS;
    for (const s of stints.filter(x => !isNaN(x.start)).sort((a, b) => a.start - b.start)) {
      const span = isNaN(s.end) ? null : Math.round((s.end - s.start) / DAY) + 1;
      if (span === null || span >= left) return s.start + left * DAY;
      left -= span;
    }
    return null;
  }
  function drawCompletion(p, body) {
    const today = dParse(sgtDate(Date.now())), t = new Date(today), y = t.getUTCFullYear(), m = t.getUTCMonth(), q = Math.floor(m / 3) * 3;
    const R = { m:[Date.UTC(y, m, 1), today, 'this month'], lm:[Date.UTC(y, m - 1, 1), Date.UTC(y, m, 0), 'last month'],
                q:[Date.UTC(y, q, 1), today, 'this quarter'], lq:[Date.UTC(y, q - 3, 1), Date.UTC(y, q, 0), 'last quarter'] };
    let [from, to, label] = R[p.comp || 'm'] || R.m;
    if (p.comp === 'c') { from = dParse(p.cfrom || sgtDate(Date.now()).slice(0, 8) + '01'); to = Math.min(dParse(p.cto || sgtDate(Date.now())), today); label = dShort(from) + ' – ' + dShort(to); }
    const order = (a, b) => catCompare(catOf(a), catOf(b), defaultCat) || a.id.localeCompare(b.id, undefined, { numeric:true });
    const list = vessels.slice().sort(order), dot = v => `<i class="dot" style="background:${v.category ? catColor(v.category) : css('--none')}"></i> `;
    const done = list.map(v => ({ v, d:completionDate(v._stints || []) })).filter(x => x.d && x.d >= from && x.d <= to).sort((a, b) => a.d - b.d);
    const onb = list.filter(v => v._p && v._p.status === 'onboard' && v._p.expectedEnd).sort((a, b) => a._p.expectedEnd - b._p.expectedEnd);
    const off = list.filter(v => v._p && (v._p.status === 'paused' || (v._p.status === 'upcoming' && v._p.days > 0)));
    const row = (v, cells) => `<tr data-id="${esc(v.id)}"><td>${dot(v)}<b>${esc(v.id)}</b></td><td>${esc(v.vessel_name)}</td><td>${esc(catOf(v))}</td>${cells}</tr>`;
    const table = (head, rows, empty) => rows ? `<table><thead><tr><th>Code</th><th>Vessel</th><th>Category</th>${head}</tr></thead><tbody>${rows}</tbody></table>` : `<div class="sub">${empty}</div>`;
    const pct = v => Math.round(100 * Math.min(v._p.days, REQ_DAYS) / REQ_DAYS);
    body.innerHTML = `<div class="cmpwrap">
      <h3>Completed ${esc(label)} · ${done.length}</h3>${table('<th>Completed on</th>', done.map(x => row(x.v, `<td>${esc(dShort(x.d))} ${new Date(x.d).getUTCFullYear()}</td>`)).join(''), 'None in this range.')}
      <h3>Expected completion (on board, soonest first) · ${onb.length}</h3>${table('<th class="num">Days</th><th class="num">Left</th><th>Expected</th><th>Progress</th>',
        onb.map(v => row(v, `<td class="num">${v._p.days}</td><td class="num">${Math.max(0, Math.round((v._p.expectedEnd - today) / DAY))}</td><td>${esc(dShort(v._p.expectedEnd))} ${new Date(v._p.expectedEnd).getUTCFullYear()}</td><td><span class="bar"><i style="width:${pct(v)}%"></i></span>${pct(v)}%</td>`)).join(''), 'No codes on board.')}
      <h3>Paused · ${off.length}</h3>${table('<th class="num">Days</th><th>Paused since</th><th>Resumes</th>',
        off.map(v => row(v, `<td class="num">${v._p.days}</td><td>${v._p.pausedSince ? esc(dShort(v._p.pausedSince)) : ''}</td><td>${v._p.nextStart ? esc(dShort(v._p.nextStart)) + (v._p.expectedEnd ? ' (exp. ' + esc(dShort(v._p.expectedEnd)) + ')' : '') : '<span class="sub">not set</span>'}</td>`)).join(''), 'None.')}</div>`;
    body.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => select(tr.dataset.id));
  }

  function drawTimeline(p, body) {
    p.el.querySelectorAll('.ptool [data-hc]').forEach(b => b.onclick = () => {
      const c = b.dataset.hc; hiddenCatsTL.has(c) ? hiddenCatsTL.delete(c) : hiddenCatsTL.add(c); saveHiddenTL();
      P.forEach(q => q.mode === 'timeline' && renderPane(q));
    });
    const today = dParse(sgtDate(Date.now()));
    const segsOf = v => {
      const segs = [], p = v._p || {};
      (v._stints || []).filter(s => !isNaN(s.start) && s.start <= today).forEach(s => segs.push({ s:s.start, e:isNaN(s.end) ? today : Math.min(s.end, today), kind:'on', vessel:s.vessel }));
      if (p.expectedEnd && ['onboard', 'paused', 'upcoming'].includes(p.status)) {
        const b = p.status !== 'onboard' && p.nextStart ? p.nextStart : Math.max(today, ...segs.filter(x => x.s <= today).map(x => x.e));
        if (p.expectedEnd > b) segs.push({ s:b, e:p.expectedEnd, kind:'plan' });
      }
      return segs;
    };
    const list = visible().filter(v => !hiddenCatsTL.has(catOf(v))).map(v => Object.assign(v, { _segs:segsOf(v) })).filter(v => v._segs.length)
      .sort((a, b) => catCompare(catOf(a), catOf(b), defaultCat) || a.id.localeCompare(b.id, undefined, { numeric:true }));
    if (!list.length) { body.innerHTML = `<div class="msg">${hiddenCatsTL.size ? 'No ships to show. Some categories are hidden: click a category above to show it.' : 'No tracking periods (start_date / end_date) in vessels.csv.'}</div>`; return; }
    const day = 864e5, lo0 = Math.min(...list.flatMap(v => v._segs.map(x => x.s))), hi0 = Math.max(...list.flatMap(v => v._segs.map(x => x.e)));
    const lo = new Date(lo0), hi = new Date(hi0);
    const start = Date.UTC(lo.getUTCFullYear(), lo.getUTCMonth(), 1), end = Date.UTC(hi.getUTCFullYear(), hi.getUTCMonth() + 1, 1);
    const LW = 150, W = Math.max(640, body.clientWidth || 640), RH = 24, TOP = 28, H = TOP + RH * list.length + 10;
    const x = t => LW + (W - LW - 10) * Math.max(0, Math.min(1, (t - start) / (end - start)));
    let svg = `<svg class="tl" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Timeline of tracking periods">`;
    for (let d = new Date(start); d.getTime() < end; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) {
      const xx = x(d.getTime()), lbl = d.toLocaleDateString('en-SG', { month:'short', ...(d.getUTCMonth() === 0 || d.getTime() === start ? { year:'numeric' } : {}), timeZone:'UTC' });
      svg += `<line x1="${xx}" y1="${TOP - 8}" x2="${xx}" y2="${H}" class="grid"/><text x="${xx + 3}" y="${TOP - 12}" class="ax">${esc(lbl)}</text>`;
    }
    list.forEach((v, i) => {
      const y = TOP + i * RH, a = period(v);
      const col = v.category ? catColor(v.category) : css('--none'), sel = v.id === selectedId;
      const rects = v._segs.map(g => g.kind === 'on'
        ? `<rect x="${x(g.s)}" y="${y + 4}" width="${Math.max(2, x(g.e + day) - x(g.s))}" height="${RH - 9}" rx="3" fill="${col}" ${sel ? 'stroke="var(--ink)" stroke-width="2"' : ''}><title>${esc(v.id)} ${esc(g.vessel || v.vessel_name)}: on board ${esc(dShort(g.s))} → ${esc(dShort(g.e))}</title></rect>`
        : `<rect x="${x(g.s)}" y="${y + 4}" width="${Math.max(2, x(g.e) - x(g.s))}" height="${RH - 9}" rx="3" fill="${col}" fill-opacity=".25" stroke="${col}" stroke-dasharray="3 2"><title>${esc(v.id)}: expected to finish ${esc(dShort(g.e))} · ${esc(a.text)}</title></rect>`).join('');
      svg += `<g class="bar" data-id="${esc(v.id)}" tabindex="0" role="button" aria-label="${esc(v.id)} ${esc(v.vessel_name)} · ${esc(a.text)}">
        <text x="0" y="${y + 15}" class="lb"><tspan font-weight="700">${esc(v.id)}</tspan> ${esc(v.vessel_name.slice(0, 16))}</text>${rects}</g>`;
    });
    const now = Date.now();
    if (now >= start && now <= end) svg += `<line x1="${x(now)}" y1="${TOP - 8}" x2="${x(now)}" y2="${H}" class="today"/><text x="${x(now) + 3}" y="${H - 2}" class="todayt">today</text>`;
    body.innerHTML = `<div class="tlwrap">${svg}</svg></div>`;
    body.querySelectorAll('g.bar').forEach(g => {
      const go = () => select(g.dataset.id); g.onclick = go; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
  }
  function refreshAll() { renderTable(); P.forEach(p => p.mode === 'fleet' && renderPane(p)); }

  function setupGutters() {
    const ws = $('ws'), left = $('left');
    const lay = store.get('layout', { left:56, top:55 });
    const apply = () => { ws.style.setProperty('--left', lay.left + '%'); left.style.setProperty('--top', lay.top + '%'); };
    apply();
    function drag(g, onMove) {
      const start = e => {
        e.preventDefault(); g.classList.add('drag'); document.body.style.userSelect = 'none';
        const move = ev => { const pt = ev.touches ? ev.touches[0] : ev; onMove(pt); apply(); };
        const up = () => { g.classList.remove('drag'); document.body.style.userSelect = ''; store.set('layout', lay);
          ['mousemove', 'touchmove'].forEach(t => window.removeEventListener(t, move)); ['mouseup', 'touchend'].forEach(t => window.removeEventListener(t, up)); relayout(); };
        window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, { passive:false });
        window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
      };
      g.addEventListener('mousedown', start); g.addEventListener('touchstart', start, { passive:false });
    }
    drag($('gutV'), pt => { const r = ws.getBoundingClientRect(); lay.left = Math.min(80, Math.max(25, (pt.clientX - r.left) / r.width * 100)); });
    drag($('gutH'), pt => { const r = left.getBoundingClientRect(); lay.top = Math.min(85, Math.max(15, (pt.clientY - r.top) / r.height * 100)); });
    const key = (g, prop, step) => g.addEventListener('keydown', e => {
      const d = { ArrowLeft:-step, ArrowUp:-step, ArrowRight:step, ArrowDown:step }[e.key]; if (!d) return;
      e.preventDefault(); lay[prop] = Math.min(prop === 'left' ? 80 : 85, Math.max(prop === 'left' ? 25 : 15, lay[prop] + d)); apply(); store.set('layout', lay); relayout();
    });
    key($('gutV'), 'left', 2); key($('gutH'), 'top', 3);
  }
  let rt;
  function relayout() {
    P.forEach(p => {
      if (p.map) p.map.invalidateSize();
    });
  }
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 150); });
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => P.forEach(p => p.map && p.map.invalidateSize()), 60); }); ['pane0', 'pane1'].forEach(id => ro.observe($(id))); }

  async function init() {
    let csv;
    try { csv = await getText('vessels.csv'); } catch (e0) { csv = null; }
    if (csv == null) try { csv = await fetchText('vessels.csv'); }
    catch (e) { banner('Could not load <b>vessels.csv</b>. Open this page through its GitHub Pages link (https://&lt;username&gt;.github.io/&lt;project&gt;/), not as a file on your computer.'); $('runPill').textContent = 'No data'; return; }
    const digits = x => String(x || '').replace(/\D/g, ''), byId = new Map(), todayD = dParse(sgtDate(Date.now()));
    parseCSV(csv).filter(v => v.id).forEach(r => { if (!byId.has(r.id)) byId.set(r.id, []); byId.get(r.id).push(r); });
    const allRows = [...byId.values()].map(rows => {
      const stints = rows.map(r => ({ start:dParse(r.start_date), end:dParse(r.end_date), row:r }))
        .sort((a, b) => (isNaN(a.start) ? Infinity : a.start) - (isNaN(b.start) ? Infinity : b.start));
      const started = stints.filter(s => !isNaN(s.start) && s.start <= todayD), cur = (started[started.length - 1] || stints[0]).row;
      const v = Object.assign({}, cur);
      v._stints = stints.map(s => ({ start:s.start, end:s.end, vessel:s.row.vessel_name }));
      v._p = periodInfo(v._stints);
      return v;
    });
    standby = allRows.filter(v => !digits(v.mmsi) && !digits(v.imo));
    vessels = allRows.filter(v => !standby.includes(v));
    standby.forEach(v => { v.category = (v.category || '').trim(); });
    let run, reports, send;
    getJSON('data/weather.json', { ships:{} }).then(d => { wx = d.ships || {}; }).catch(() => {});
    [latest, run, reports, ports, , send] = await Promise.all([getJSON('data/latest.json', {}), getJSON('data/run_log.json', null),
      getJSON('reports/index.json', []), getJSON('assets/ports.json', { ports:[] }).then(d => d.ports || []),
      getJSON('assets/mid.json', { mid:{} }).then(d => { mids = d.mid || {}; }), getJSON('data/send.json', null)]);
    setupSend(send);
    const order = { fresh:0, stale:1, old:2, none:3 };
    vessels.forEach(v => {
      const p = latest[v.id] || {};
      v.category = (v.category || '').trim();
      if (v.category && !catOrder.includes(v.category)) catOrder.push(v.category);
      v._state = stateOf(p.last_seen_utc);
      v._age = p.last_seen_utc ? Date.now() - new Date(p.last_seen_utc).getTime() : Infinity;
      v._place = p.latitude != null ? placeLabel(p.latitude, p.longitude) : '';
      v._speed = p.speed_kn ?? -1;
      v._att = period(v).n;
    });
    vessels.sort((a, b) => order[a._state] - order[b._state] || a.id.localeCompare(b.id, undefined, { numeric:true }));
    standby.forEach(v => { if (v.category && !catOrder.includes(v.category)) catOrder.push(v.category); });
    defaultCat = latestCat([...new Set(vessels.concat(standby).map(catOf))]);
    openCats = new Set();
    selectedId = (vessels.find(v => latest[v.id] && catOf(v) === defaultCat) || vessels.find(v => latest[v.id]) || vessels[0] || {}).id || '';

    if (catOrder.length) {
      const sel = $('catFilter'); sel.hidden = false;
      sel.innerHTML = '<option value="">All categories</option>' + catOrder.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('') +
        (vessels.some(v => !v.category) ? '<option value="__none">No category</option>' : '');
      sel.onchange = () => { catFilter = sel.value; refreshAll(); };
    }
    $('search').addEventListener('input', e => { query = e.target.value; renderTable(); });
    document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
      const k = th.dataset.sort; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; renderTable();
    });

    renderRun(run); renderChips(); renderReports(reports); renderTable(); setupGutters();
    getJSON('assets/locode.json', { codes:{} }).then(d => { locode = d.codes || {}; renderTable(); });
    ['pane0', 'pane1'].forEach((id, i) => { const p = Object.assign({ mode:'fleet', range:'30' }, panes[i] || {}, { ship:'', el:$(id), markers:{} }); if (!MODES[p.mode]) p.mode = 'fleet'; P.push(p); renderPane(p); });
    const issues = checkRoster(vessels);
    if (issues.length) banner(`<b>vessels.csv needs checking (${issues.length}):</b> ${issues.slice(0, 6).map(esc).join(' · ')}${issues.length > 6 ? ' …' : ''}`);
    if (vessels.some(v => /^SAMPLE /i.test(v.vessel_name))) banner('Showing <b>sample vessels</b>. Edit <b>vessels.csv</b> with the real ship names, IMO and MMSI numbers to start tracking.');
  }
  start();
})();
</script>
